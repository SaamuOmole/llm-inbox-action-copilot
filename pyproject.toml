[project]
name = "inboxcopilot"
version = "0.1.0"
description = "Local LLM-powered inbox action copilot"
authors = [
    {name = "Samuel Omole",email = "omole.samuel92@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bs4 (>=0.0.2,<0.0.3)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "streamlit (>=1.54.0,<2.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "openai (>=2.18.0,<3.0.0)",
    "adjusttext (>=1.3.0,<2.0.0)",
    "sentence-transformers (>=5.2.2,<6.0.0)"
]

[tool.poetry]
packages = [{ include = "inboxcopilot", from = "src" }]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
